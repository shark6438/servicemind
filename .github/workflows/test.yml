name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    # The ServiceMind suite (tests/service, tests/servicemind) imports
    # src/servicemind/persistence at collection time, which raises unless
    # SERVICEMIND_DATABASE_URL is set, and most of it queries an applied schema.
    # Local runs get both from a gitignored .env; CI must supply them explicitly.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: servicemind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SERVICEMIND_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/servicemind_test"
      OPENAI_API_KEY: "sk-fake-openai-key"

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.32"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Lint and format with ruff
      run: |
        uv run ruff format --check
        uv run ruff check --output-format github

    - name: Type check with pyrefly
      run: |
        uv run pyrefly check

    - name: Migrate ServiceMind test database
      run: |
        uv run alembic upgrade head

    - name: Test with pytest
      run: |
        uv run pytest --cov=src/ --cov-report=xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # The architecture contract from scripts/audit_project_structure.py: package cycles,
  # domain import direction, source-tree boundaries, process manifests, and the frozen
  # budget for scaffold imports left inside the product. --check also fails when the
  # committed report under evaluation/reports/ no longer matches the tree, so the evidence
  # cannot drift away from the thing it describes. Runs once: it reads files, not runtimes.
  architecture-gate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.32"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Audit project structure
      run: |
        uv run python scripts/audit_project_structure.py --check

  # The four Phase 7 evidence gates, offline. They judge observations recorded under
  # evaluation/*/replays/ and write a report; they never run the platform. That is a
  # property of the gates, not of how they are invoked here: no gate defines a live mode,
  # and the quality and load gates reject `--live` by name, because a gate that produced its
  # own observations would grade whatever it happened to execute and call it the platform.
  #
  # The load gate is the one whose absence here would be least visible and most corrosive:
  # it is the gate that compares loaded runs against unloaded ones, so a load plan edited
  # after a batch -- a tier's concurrency narrowed, a question swapped for one that behaves
  # -- would otherwise be re-graded against its own recorded evidence with nothing to say so.
  # Its digest check is what makes that exit 3.
  #
  # So what this job proves is bounded, and the bound is the point: the frozen
  # observations still grade the same way against the case lists as they stand. It is not
  # evidence that the deployed platform passes. That evidence comes from the live drivers
  # on a machine with a stack, and it is recorded in the report this job regenerates. The
  # digest binding is what keeps the two apart -- edit a case, an expected citation or a
  # scenario and the corresponding gate exits 3 here, instead of reporting yesterday's run
  # against today's list.
  #
  # No services and no secrets: all three gates run without a database, a model key or a
  # network (verified by running them with SERVICEMIND_DATABASE_URL and OPENAI_API_KEY
  # unset). A database service here would suggest otherwise.
  #
  # Exit codes, all three gates: 0 PASS, 1 FAIL, 2 not enough observation, 3 the inputs
  # have drifted apart. Every non-zero fails the job; 2 and 3 are not softer than 1, they
  # are different, and all three mean the evidence does not support what is claimed.
  #
  # `--force` is deliberately absent, here and everywhere else in CI. It overwrites a
  # report whose digests disagree with its inputs, which is the one condition this job
  # exists to make loud.
  #
  # The replays must be committed for this job to have anything to read. They are evidence,
  # not build output, and a batch re-run on a workstation only reaches here by being
  # committed -- which is also what dates it: each observation carries the revision and the
  # timestamp it was taken under, and the report prints both.
  phase7-offline-gates:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.32"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Grade the acceptance observations
      run: |
        uv run python scripts/gate_phase7_acceptance.py --replay-only --check \
          --format markdown --report evaluation/reports/phase7_acceptance_latest.md
    - name: Grade the security observations
      run: |
        uv run python scripts/gate_phase7_security.py --replay-only --check --format markdown \
          --report evaluation/reports/phase7_security_latest.md
    - name: Grade the quality observations
      run: |
        uv run python scripts/gate_phase7_quality.py --replay-only --check --format markdown \
          --report evaluation/reports/phase7_quality_latest.md
    - name: Grade the load observations
      run: |
        uv run python scripts/gate_phase7_load.py --replay-only --check --format markdown \
          --report evaluation/reports/phase7_load_latest.md

  lint-markdown:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.32"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen --only-group dev
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Lint markdown with pymarkdown
      run: |
        # Scan README.md plus every tracked doc under docs/, EXCLUDING four
        # documents whose authoring conventions intentionally diverge from
        # pymarkdown's defaults and are kept as-is rather than rewritten to
        # pass the linter:
        #   - 企业IT服务管理(ITSM)智能体平台.md            (frozen multi-H1 master spec)
        #   - PHASE4_ENTERPRISE_ACCEPTANCE.md            (historical, superseded)
        #   - PHASE4_RAG_FRONTIER_GAP_ANALYSIS.md
        #   - PHASE4_RAG_MULTI_AGENT_AUDIT_2026-09-08.md
        # New docs committed under docs/ are still linted automatically because
        # the file list is resolved from `git ls-files` at run time.
        docs=$(git -c core.quotePath=false ls-files 'docs/*.md' \
          | grep -vF -e 'docs/企业IT服务管理(ITSM)智能体平台.md' \
                     -e 'docs/PHASE4_ENTERPRISE_ACCEPTANCE.md' \
                     -e 'docs/PHASE4_RAG_FRONTIER_GAP_ANALYSIS.md' \
                     -e 'docs/PHASE4_RAG_MULTI_AGENT_AUDIT_2026-09-08.md')
        uv run pymarkdown scan README.md $docs

  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install locked frontend dependencies
      working-directory: frontend
      run: npm ci
    - name: Lint, type-check, test and build operator console
      working-directory: frontend
      run: npm run check
    - name: Audit dependencies and generate frontend SBOM
      working-directory: frontend
      run: |
        npm audit --audit-level=high
        npm sbom --sbom-format=cyclonedx > frontend-sbom.cdx.json
    - name: Upload frontend SBOM
      uses: actions/upload-artifact@v7
      with:
        name: frontend-sbom
        path: frontend/frontend-sbom.cdx.json

  test-docker:
    runs-on: ubuntu-latest

    services:
      dind:
        image: docker:dind
        ports:
          - 2375:2375
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Build service image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: servicemind.service:${{ github.sha }}
          file: docker/Dockerfile.service

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: servicemind.app:${{ github.sha }}
          file: docker/Dockerfile.app

      - name: Build operator console image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          load: true
          provenance: false
          tags: servicemind.frontend:${{ github.sha }}
          file: frontend/Dockerfile

      - name: Scan operator console image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --db-repository public.ecr.aws/aquasecurity/trivy-db:2 \
            --db-repository mirror.gcr.io/aquasec/trivy-db:2 \
            --timeout 10m --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            servicemind.frontend:${{ github.sha }}

      - name: Start service container
        # Must be a literal (|) block: as a plain multi-line scalar YAML folds the
        # line breaks into spaces, which turns the shell line-continuation "\" into
        # a literal backslash-space and makes docker reject the reference.
        run: |
          docker run -d --name service-container --network host \
            -e USE_FAKE_MODEL=true \
            -e PORT=80 \
            -e SERVICEMIND_DATABASE_URL='sqlite+aiosqlite:////app/sm.db' \
            servicemind.service:${{ github.sha }}

      - name: Confirm service starts correctly
        run: |
          # service.py imports servicemind at startup, so SERVICEMIND_DATABASE_URL
          # above is required; boot is import-time network-free (tiktoken encoders
          # are lazy), so a 90s budget covers a cold interpreter on a loaded runner.
          timeout 90 bash -c '
            while ! curl -s http://0.0.0.0/health; do
              echo "Waiting for service to be ready..."
              docker logs service-container
              sleep 2
            done
          '

      - name: Run app container
        run: docker run -d --name app-container --network host -e AGENT_URL=http://0.0.0.0 servicemind.app:${{ github.sha }}

      - name: Confirm app starts correctly
        run: |
          timeout 90 bash -c '
            while ! curl -s http://localhost:8501/healthz; do
              echo "Waiting for app to be ready..."
              docker logs app-container
              sleep 2
            done
          '

      - name: Run and verify operator console container
        run: |
          docker run -d --name frontend-container --network host \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e PORT=3000 \
            servicemind.frontend:${{ github.sha }}
          timeout 30 bash -c '
            while ! curl -fsS http://localhost:3000/ >/dev/null; do
              docker logs frontend-container
              sleep 1
            done
          '

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install ONLY CLIENT dependencies with uv
        run: |
          uv sync --frozen --only-group client --only-group dev
        env:
          UV_SYSTEM_PYTHON: 1
      - name: Run integration tests
        run: |
          uv run pytest tests/integration -v --run-docker
        env:
          AGENT_URL: http://0.0.0.0

      - name: Clean up containers
        if: always()
        run: |
          docker stop service-container app-container frontend-container || true
          docker rm service-container app-container frontend-container || true
